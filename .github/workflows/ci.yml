# Continuous integration for cogniawerks-web: lint, typecheck, tests, build, npm audit, SAST, secret scan,
# container scan and a Playwright smoke test against `vite preview`.
# Supply chain: every third-party action is pinned to a full commit SHA (version in the comment), scanner binaries are
# pinned to a release and verified against its SHA-256, scanner images are pinned by digest. The `action-pinning` job
# (and test/ci-workflows.test.ts) fails when a `uses:` reference is not pinned to a SHA. No secrets are used;
# GITHUB_TOKEN is read-only. See ADR-020 in the cogniawerks-api repository.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  GITLEAKS_VERSION: '8.30.1'
  GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
  TRIVY_VERSION: '0.75.0'
  TRIVY_SHA256: 'c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f'
  SEMGREP_IMAGE: 'semgrep/semgrep:1.179.0@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b'

jobs:
  pinning:
    name: action-pinning
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every action reference is pinned to a full commit SHA
        run: |
          unpinned="$(grep -rnE '^\s*(-\s*)?uses:' .github/workflows \
            | grep -vE 'uses:\s*\./' \
            | grep -vE 'uses:\s*[^@[:space:]]+@[0-9a-f]{40}(\s|$)' || true)"
          if [ -n "$unpinned" ]; then
            echo "::error::Actions must be pinned to a full commit SHA:"
            echo "$unpinned"
            exit 1
          fi
          echo "All action references are SHA-pinned."

  quality:
    name: lint-typecheck-test-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Lint (0 warnings)
        run: npm run lint
      - name: Typecheck (tsc -b)
        run: npm run typecheck
      - name: Unit, component, i18n and axe tests
        run: npm test
      - name: Lint the API contract
        run: npm run api:lint
      - name: Build
        run: npm run build

  audit:
    name: npm-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Fail on high or critical advisories
        run: npm audit --audit-level=high --package-lock-only

  sast:
    name: sast
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # eslint-plugin-security runs in the lint step; Semgrep CE adds pattern rules for TypeScript/React,
      # the Dockerfile and workflow files. It fails on any finding.
      - name: Semgrep CE
        run: >-
          docker run --rm -v "${{ github.workspace }}:/src" -w /src "$SEMGREP_IMAGE"
          semgrep scan --metrics=off --error --disable-version-check
          --config p/typescript --config p/react --config p/dockerfile --config p/github-actions

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned, checksum verified)
        run: |
          cd "$RUNNER_TEMP"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p bin && tar -xzf "$archive" -C bin gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Scan the full git history
        run: gitleaks git --redact --no-banner --exit-code 1 --verbose .

  container-scan:
    name: container-scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build web image
        run: docker build -t cogniawerks-web:ci .
      - name: Install Trivy (pinned, checksum verified)
        run: |
          cd "$RUNNER_TEMP"
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSLo "$archive" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${archive}"
          echo "${TRIVY_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p bin && tar -xzf "$archive" -C bin trivy
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Trivy report (SARIF, all severities)
        run: trivy image --no-progress --format sarif --output trivy-web.sarif cogniawerks-web:ci
      - name: Upload SARIF
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-web-sarif
          path: trivy-web.sarif
          if-no-files-found: warn
          retention-days: 14
      - name: Fail on High or Critical with an available fix
        run: >-
          trivy image --no-progress --skip-db-update
          --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          cogniawerks-web:ci

  e2e:
    name: playwright-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx --no-install playwright install --with-deps chromium
      - name: Playwright smoke against vite preview (desktop and tablet, axe)
        run: npm run test:e2e
        env:
          CI: 'true'
