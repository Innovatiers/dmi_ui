# Continuous integration for cogniawerks-web: lint, typecheck, tests, build, npm audit, SAST, secret scan,
# container scan, SBOMs and licence inventory, a gate self-test and a Playwright smoke test against `vite preview`.
# Supply chain: every third-party action is pinned to a full commit SHA (version in the comment), scanner binaries are
# pinned to a release and verified against its SHA-256, scanner images are pinned by digest. The `action-pinning` job
# (and test/ci-workflows.test.ts) fails when a `uses:` reference or a pre-commit hook revision is not pinned to a SHA.
# No secrets are used; GITHUB_TOKEN is read-only. See ADR-020 and ADR-034 in the cogniawerks-api repository.
# Accepted vulnerability exceptions live in security/exceptions.yaml; an expired exception fails every gate reading it.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  GITLEAKS_VERSION: '8.30.1'
  GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
  TRIVY_VERSION: '0.75.0'
  TRIVY_SHA256: 'c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f'
  SEMGREP_IMAGE: 'semgrep/semgrep:1.179.0@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b'

jobs:
  pinning:
    name: action-pinning
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every action reference is pinned to a full commit SHA
        run: |
          unpinned="$(grep -rnE '^\s*(-\s*)?uses:' .github/workflows \
            | grep -vE 'uses:\s*\./' \
            | grep -vE 'uses:\s*[^@[:space:]]+@[0-9a-f]{40}(\s|$)' || true)"
          if [ -n "$unpinned" ]; then
            echo "::error::Actions must be pinned to a full commit SHA:"
            echo "$unpinned"
            exit 1
          fi
          echo "All action references are SHA-pinned."
      - name: Every pre-commit hook revision is pinned to a full commit SHA
        run: |
          unpinned="$(grep -nE '^\s*rev:' .pre-commit-config.yaml | grep -vE 'rev:\s*[0-9a-f]{40}(\s|$)' || true)"
          if [ -n "$unpinned" ]; then
            echo "::error::pre-commit revisions must be pinned to a full commit SHA:"
            echo "$unpinned"
            exit 1
          fi
          echo "All pre-commit revisions are SHA-pinned."

  quality:
    name: lint-typecheck-test-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Lint (0 warnings)
        run: npm run lint
      - name: Typecheck (tsc -b)
        run: npm run typecheck
      - name: Unit, component, i18n and axe tests
        run: npm test
      - name: Lint the API contract
        run: npm run api:lint
      - name: Build
        run: npm run build

  audit:
    name: npm-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Exceptions are well-formed and none has expired
        run: node scripts/security/exceptions.mjs check
      - name: Fail on high or critical advisories without a valid exception
        run: |
          # npm audit exits non-zero when it finds advisories; the gate decides. A missing or broken report fails.
          npm audit --package-lock-only --json > "$RUNNER_TEMP/audit.json" || true
          node scripts/security/exceptions.mjs npm-gate "$RUNNER_TEMP/audit.json"

  sast:
    name: sast
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # eslint-plugin-security runs in the lint step; Semgrep CE adds pattern rules for TypeScript/React,
      # the Dockerfile and workflow files. It fails on any finding.
      - name: Semgrep CE
        run: >-
          docker run --rm -v "${{ github.workspace }}:/src" -w /src "$SEMGREP_IMAGE"
          semgrep scan --metrics=off --error --disable-version-check
          --config p/typescript --config p/react --config p/dockerfile --config p/github-actions

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned, checksum verified)
        run: |
          cd "$RUNNER_TEMP"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p bin && tar -xzf "$archive" -C bin gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Scan the full git history
        run: gitleaks git --redact --no-banner --exit-code 1 --verbose .

  container-scan:
    name: container-scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build web image
        run: docker build -t cogniawerks-web:ci .
      - name: Image runs as a non-root user
        run: |
          user="$(docker image inspect -f '{{.Config.User}}' cogniawerks-web:ci)"
          echo "cogniawerks-web:ci runs as '${user}'"
          case "${user%%:*}" in
            ""|0|root) echo "::error::cogniawerks-web:ci must run as a non-root user"; exit 1 ;;
          esac
      - name: Install Trivy (pinned, checksum verified)
        run: |
          cd "$RUNNER_TEMP"
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSLo "$archive" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${archive}"
          echo "${TRIVY_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p bin && tar -xzf "$archive" -C bin trivy
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Valid exceptions as a Trivy ignore file
        run: node scripts/security/exceptions.mjs trivyignore "$RUNNER_TEMP/trivyignore"
      - name: Pull the pinned base images
        run: |
          grep -hE '^FROM [^ ]+@sha256:' Dockerfile | awk '{print $2}' | sort -u > "$RUNNER_TEMP/base-images.txt"
          cat "$RUNNER_TEMP/base-images.txt"
          xargs -n1 docker pull --quiet < "$RUNNER_TEMP/base-images.txt"
      - name: Trivy reports (SARIF, all severities) and image SBOM (CycloneDX)
        run: |
          mkdir -p reports sbom
          trivy image --no-progress --download-db-only
          trivy image --no-progress --skip-db-update --format sarif --output reports/trivy-web.sarif cogniawerks-web:ci
          trivy image --no-progress --skip-db-update --format cyclonedx --output sbom/cogniawerks-web.image.cdx.json cogniawerks-web:ci
          while read -r base; do
            name="$(echo "${base%%@*}" | tr '/:' '__')"
            trivy image --no-progress --skip-db-update --format sarif --output "reports/trivy-base-${name}.sarif" "$base"
          done < "$RUNNER_TEMP/base-images.txt"
      - name: Upload SARIF reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-web-sarif
          path: reports/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload image SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-images
          path: sbom/
          if-no-files-found: error
          retention-days: 90
      - name: Fail on High or Critical with an available fix, unless excepted
        # The shipped nginx base image is a layer of the web image, so gating the web image gates it too. The node
        # image is a build stage only; its findings are in the SARIF artifact.
        run: >-
          trivy image --no-progress --skip-db-update --ignorefile "$RUNNER_TEMP/trivyignore"
          --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          cogniawerks-web:ci

  sbom:
    name: sbom-licenses
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: CycloneDX SBOM of the npm dependencies (from package-lock.json)
        run: |
          mkdir -p sbom
          npm sbom --sbom-format cyclonedx --package-lock-only > sbom/cogniawerks-web.npm.cdx.json
          jq -e '.bomFormat == "CycloneDX" and (.components | length) > 0' sbom/cogniawerks-web.npm.cdx.json > /dev/null
      - name: Licence inventory (npm)
        run: node scripts/security/licenses.mjs report sbom/licenses-npm.md
      - name: Upload SBOM and licence inventory
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-source
          path: sbom/
          if-no-files-found: error
          retention-days: 90
      - name: Copyleft and unknown licences are acknowledged in docs/security/licenses.md
        run: node scripts/security/licenses.mjs check

  gate-selftest:
    name: gate-selftest
    # Proves on every run that the gates fail on known-bad input: a committed fake secret, a package with a known
    # Critical advisory, and an expired exception. Everything is generated in a temporary directory outside the checkout.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install gitleaks (pinned, checksum verified)
        run: |
          cd "$RUNNER_TEMP"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p bin && tar -xzf "$archive" -C bin gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Secret scan fails on a committed fake secret
        run: bash scripts/security/selftest-secret.sh "$RUNNER_TEMP/secret-canary"
      - name: npm audit gate fails on a package with a known Critical advisory and on an expired exception
        run: bash scripts/security/selftest-npm.sh "$RUNNER_TEMP/audit-canary"

  e2e:
    name: playwright-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx --no-install playwright install --with-deps chromium
      - name: Playwright smoke against vite preview (desktop and tablet, axe)
        run: npm run test:e2e
        env:
          CI: 'true'
